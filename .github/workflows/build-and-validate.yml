name: Build and Validate

on:
  push:
    branches:
      - main
      - Opa-Testing-Feature
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: lambda_app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install -g aws-cdk

      - name: Install OPA
        run: |
          curl -fsSL -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Check Rego policies
        working-directory: lambda_app
        run: |
          opa check policies

      - name: Synthesize CDK template
        working-directory: lambda_app/cdk
        run: |
          cdk synth --output cdk.out
          find cdk.out -name '*.template.json' -type f

      - name: Validate CDK template with OPA
        id: opa_validate
        working-directory: lambda_app
        run: |
          set -euo pipefail
          found_template=0
          for template in cdk/cdk.out/*.template.json; do
            [ -f "$template" ] || continue
            found_template=1
            echo "Validating $template"
            for policy in policies/*.rego; do
              package=$(awk '/^package / { print $2; exit }' "$policy")
              if opa eval --fail-defined --format pretty -d policies -d "$template" "data.${package}.deny_message"; then
                echo "PASS $(basename "$policy")"
              else
                echo "FAIL $(basename "$policy")"
                exit 1
              fi
            done
          done

          if [ "$found_template" -eq 0 ]; then
            echo "No synthesized CloudFormation templates were found."
            exit 1
          fi

      - name: Smoke test Lambda handler
        working-directory: lambda_app
        run: |
          python - <<'PY'
          import json
          import sys
          sys.path.insert(0, 'lambda_handler')
          from index import handle_hello_get, handle_hello_post, handler

          hello_response = handle_hello_get()
          assert hello_response['statusCode'] == 200

          personalized = handle_hello_post({'body': json.dumps({'name': 'Test'})})
          assert personalized['statusCode'] == 200

          routed = handler({'httpMethod': 'GET', 'path': '/hello'}, object())
          assert routed['statusCode'] == 200
          PY

      - name: Generate validation report
        if: always()
        working-directory: lambda_app
        run: |
          mkdir -p reports
          {
            echo '# CI Validation Report'
            echo
            echo "Date: $(date)"
            echo "Branch: ${GITHUB_REF#refs/heads/}"
            echo "Commit: ${GITHUB_SHA:0:7}"
            echo "Policy count: $(find policies -name '*.rego' | wc -l | tr -d ' ')"
            echo
            if [ "${{ steps.opa_validate.outcome }}" = 'success' ]; then
              echo 'OPA validation: PASSED'
            else
              echo 'OPA validation: FAILED'
            fi
          } > reports/validation-report.md

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: lambda_app/reports/
          if-no-files-found: error

      - name: Upload synthesized templates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdk-output
          path: lambda_app/cdk/cdk.out/
          if-no-files-found: error
